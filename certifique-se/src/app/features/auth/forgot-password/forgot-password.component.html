<div class="min-h-[calc(100vh-12rem)] flex items-center justify-center py-8 sm:py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-6 rounded-3xl bg-slate-900/60 border border-slate-800 p-5 sm:p-8 backdrop-blur-xl shadow-2xl">
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-blue-500/10 text-blue-400 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
        </svg>
      </div>
      <h2 class="text-2xl font-extrabold text-white">Recuperar Senha</h2>
      <p class="text-sm text-slate-400 mt-2">Informe seu e-mail para receber o link de redefinição</p>
    </div>

    @if (successMessage) {
      <div class="rounded-xl bg-emerald-500/10 border border-emerald-500/20 p-4 text-sm text-emerald-400 flex items-center gap-2.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span>{{ successMessage }}</span>
      </div>
    }

    @if (errorMessage) {
      <div class="rounded-xl bg-red-500/10 border border-red-500/20 p-4 text-sm text-red-400 flex items-center gap-2.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">E-mail</label>
        <input id="email" type="email" formControlName="email" placeholder="seu@email.com"
               class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        @if (form.get("email")?.touched && form.get("email")?.invalid) {
          <p class="text-xs text-red-400 mt-1">Informe um e-mail válido</p>
        }
      </div>

      <button type="submit" [disabled]="isLoading"
              class="w-full py-3.5 px-4 rounded-xl text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 transition-all disabled:opacity-50 flex items-center justify-center gap-2">
        @if (isLoading) {
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>Enviando...</span>
        } @else {
          <span>Enviar link de recuperação</span>
        }
      </button>
    </form>

    <div class="text-center text-sm text-slate-400">
      Lembrou sua senha?
      <a routerLink="/login" class="text-blue-400 hover:text-blue-300 ml-1">Voltar ao login</a>
    </div>
  </div>
</div>
