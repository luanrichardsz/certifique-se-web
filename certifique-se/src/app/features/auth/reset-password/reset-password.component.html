<div class="min-h-[calc(100vh-12rem)] flex items-center justify-center py-8 sm:py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-6 rounded-3xl bg-slate-900/60 border border-slate-800 p-5 sm:p-8 backdrop-blur-xl shadow-2xl">
    <div class="text-center">
      <h2 class="text-2xl font-extrabold text-white">Criar Nova Senha</h2>
      <p class="text-sm text-slate-400 mt-2">Defina sua nova credencial de acesso</p>
    </div>

    @if (errorMessage) {
      <div class="rounded-xl bg-red-500/10 border border-red-500/20 p-4 text-sm text-red-400">
        {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div class="rounded-xl bg-emerald-500/10 border border-emerald-500/20 p-4 text-sm text-emerald-400">
        {{ successMessage }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="novaSenha" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Nova Senha</label>
        <div class="relative">
          <input id="novaSenha" [type]="showNovaSenha ? 'text' : 'password'" formControlName="novaSenha" placeholder="••••••••"
                 class="w-full pl-4 pr-11 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <button type="button"
                  (click)="showNovaSenha = !showNovaSenha"
                  class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors focus:outline-none"
                  tabindex="-1"
                  [attr.aria-label]="showNovaSenha ? 'Ocultar senha' : 'Ver senha'"
                  [title]="showNovaSenha ? 'Ocultar senha' : 'Ver senha'">
            @if (showNovaSenha) {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
      </div>

      <div>
        <label for="confirmarSenha" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Confirmar Nova Senha</label>
        <div class="relative">
          <input id="confirmarSenha" [type]="showConfirmarSenha ? 'text' : 'password'" formControlName="confirmarSenha" placeholder="••••••••"
                 class="w-full pl-4 pr-11 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <button type="button"
                  (click)="showConfirmarSenha = !showConfirmarSenha"
                  class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors focus:outline-none"
                  tabindex="-1"
                  [attr.aria-label]="showConfirmarSenha ? 'Ocultar senha' : 'Ver senha'"
                  [title]="showConfirmarSenha ? 'Ocultar senha' : 'Ver senha'">
            @if (showConfirmarSenha) {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading"
              class="w-full py-3.5 px-4 rounded-xl text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 transition-all disabled:opacity-50">
        {{ isLoading ? "Redefinindo..." : "Salvar Nova Senha" }}
      </button>
    </form>
  </div>
</div>
