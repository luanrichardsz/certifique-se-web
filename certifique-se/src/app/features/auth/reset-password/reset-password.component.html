<div class="min-h-[calc(100vh-12rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-6 rounded-3xl bg-slate-900/60 border border-slate-800 p-8 backdrop-blur-xl shadow-2xl">
    <div class="text-center">
      <h2 class="text-2xl font-extrabold text-white">Criar Nova Senha</h2>
      <p class="text-sm text-slate-400 mt-2">Defina sua nova credencial de acesso</p>
    </div>

    @if (errorMessage) {
      <div class="rounded-xl bg-red-500/10 border border-red-500/20 p-4 text-sm text-red-400">
        {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div class="rounded-xl bg-emerald-500/10 border border-emerald-500/20 p-4 text-sm text-emerald-400">
        {{ successMessage }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="novaSenha" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Nova Senha</label>
        <input id="novaSenha" type="password" formControlName="novaSenha" placeholder="••••••••"
               class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label for="confirmarSenha" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Confirmar Nova Senha</label>
        <input id="confirmarSenha" type="password" formControlName="confirmarSenha" placeholder="••••••••"
               class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <button type="submit" [disabled]="isLoading"
              class="w-full py-3.5 px-4 rounded-xl text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 transition-all disabled:opacity-50">
        {{ isLoading ? "Redefinindo..." : "Salvar Nova Senha" }}
      </button>
    </form>
  </div>
</div>
